services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: smartopd_user
      POSTGRES_PASSWORD: change_me_secure_password
      POSTGRES_DB: smartopd_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartopd_user -d smartopd_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./smart-opd-backend
    ports:
      - "8000:8000"
    env_file:
      - ./smart-opd-backend/.env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: